<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Exitency Bot</title>
<link rel="stylesheet" href="css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
<div id="app">
  <header class="top-bar">
    <div class="top-left">
      <span class="logo-icon">рџ’Ћ</span>
      <span class="logo-text">Exitency</span>
    </div>
    <div class="top-right">
      <span class="balance" id="balance">в… 0</span>
    </div>
  </header>

  <main id="main">
    <!-- TABS -->
    <nav class="tabs">
      <button class="tab active" data-tab="cases">рџЋЃ Cases</button>
      <button class="tab" data-tab="upgrade">в¬†пёЏ Upgrade</button>
      <button class="tab" data-tab="shop">рџ’° Shop</button>
      <button class="tab" data-tab="inventory">рџ“¦ Inventory</button>
    </nav>

    <!-- CASES -->
    <section id="sec-cases" class="section active">
      <div class="section-title">Open Cases</div>
      <div class="case-grid" id="caseGrid"></div>
    </section>

    <!-- CASE OPEN VIEW -->
    <section id="sec-caseopen" class="section hidden">
      <button class="back-btn" onclick="showCases()">в†ђ Back</button>
      <div class="case-open-header" id="caseOpenHeader"></div>
      <div class="spinner-wrap" id="spinnerWrap">
        <div class="spinner" id="spinner"></div>
      </div>
      <div class="result-card hidden" id="resultCard"></div>
      <button class="btn-gold" id="openBtn" onclick="doOpen()" style="display:block;margin:0 auto 20px">Open Case</button><div class="case-items-list" id="caseItemsList"></div>
    </section>

    <!-- UPGRADE -->
    <section id="sec-upgrade" class="section hidden">
      <div class="section-title">Upgrade Items</div>
      <div class="upgrade-from" id="upgradeFrom">
        <div class="upgrade-label">Select item to upgrade:</div>
        <div class="upgrade-items" id="upgradeItems"></div>
      </div>
      <div class="upgrade-visual hidden" id="upgradeVisual">
        <div class="upgrade-circle from" id="upgradeFromCircle">
          <span class="uv-val" id="upgradeFromVal">в… 0</span>
          <span class="uv-lbl">Your item</span>
        </div>
        <div class="upgrade-arrow">в†’</div>
        <div class="upgrade-circle to" id="upgradeToCircle">
          <span class="uv-val" id="upgradeToVal">в… 0</span>
          <span class="uv-lbl">Target</span>
        </div>
      </div>
      <div class="upgrade-info hidden" id="upgradeInfo">
        <div>Bet: <span id="upgradeBet">в… 0</span></div>
        <div>Chance: <span id="upgradeChance">0%</span></div>
      </div>
      <button class="btn-gold hidden" id="upgradeBtn" onclick="doUpgrade()">в¬†пёЏ Upgrade</button>
      <div class="upgrade-result hidden" id="upgradeResult"></div>
    </section>

    <!-- SHOP -->
    <section id="sec-shop" class="section hidden">
      <div class="section-title">Buy Stars</div>
      <div class="pack-grid" id="packGrid"></div>
      <div class="section-title" style="margin-top:24px">Payment Methods</div>
      <div class="methods-list" id="methodsList"></div>
      <div class="buy-modal hidden" id="buyModal">
        <div class="modal-card">
          <div class="modal-title" id="modalTitle">Buy в… 100</div>
          <div class="modal-price" id="modalPrice">$2.50</div>
          <div class="modal-methods" id="modalMethods"></div>
          <button class="btn-close" onclick="closeModal()">Cancel</button>
        </div>
      </div>
    </section>

    <!-- INVENTORY -->
    <section id="sec-inventory" class="section hidden">
      <div class="section-title">Your Items</div>
      <div class="inv-list" id="invList"></div>
    </section>
  </main>
</div>
<script src="js/app.js"></script>
</body>
</html>
