<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>BananGift</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="bg-anim"></div>
<div id="app">
  <header class="topbar">
    <div class="topbar-left">
      <span class="topbar-logo">BananGift</span>
    </div>
    <div class="topbar-right" id="topStars" style="display:none" onclick="showPage('shop')">
      <span class="star-icon">★</span>
      <span class="star-count" id="topBalance">0</span>
      <span class="stars-plus" onclick="showPage('shop')">+</span>
    </div>
  </header>

  <main>
    <div class="page active" id="page-cases">
      <div class="hero-banner"><img src="/img/hero.png" class="hero-img" onerror="this.parentElement.style.display='none'"></div>
      <div class="page-title">Кейсы</div>
      <div class="cases-grid" id="caseList"></div>
    </div>

    <div class="page" id="page-caseopen">
      <button class="back-btn" onclick="showPage('cases')">← Назад</button>
      <div class="case-open-top" id="caseOpenTop"></div>
      <div class="spinner-container" id="spinnerContainer" style="display:none">
        <div class="spinner-line"></div>
        <div class="spinner-track" id="spinnerTrack"></div>
      </div>
      <div id="openBtnWrap" style="margin-bottom:16px">
        <button class="btn btn-pink" onclick="doOpen()">Открыть кейс</button>
      </div>
      <div id="resultWrap"></div>
      <div class="items-title">Содержимое кейса</div>
      <div class="items-grid" id="caseItemsGrid"></div>
    </div>

    <div class="page" id="page-shop">
      <div class="section-title">Магазин</div>
      <div id="packGrid"></div>
      <div class="pay-title">Оплата</div>
      <div class="pay-list" id="payList"></div>
    </div>

    <div class="page" id="page-profile">
      <div class="profile-card">
        <div class="profile-avatar" id="profileAvatar">🍌</div>
        <div class="profile-name" id="profileName">Пользователь</div>
        <div class="profile-id" id="profileId">ID: 0</div>
      </div>
      <div class="profile-stars" onclick="showPage('shop')">
        <div class="ps-left">
          <span class="ps-icon">★</span>
          <span class="ps-count" id="profileBalance">0</span>
          <span class="ps-label">звёзд</span>
        </div>
        <div class="ps-right">
          <div class="ps-plus" onclick="showPage('shop')">+</div>
          <span class="ps-hint">Пополнить</span>
        </div>
      </div>
      <div class="stats-grid" id="statsGrid"></div>
      <div class="section-title" style="margin-top:16px">Инвентарь</div>
      <div id="invList"></div>
      <div class="section-title" style="margin-top:16px">История</div>
      <div id="historyList"></div>
    </div>
  </main>

  <nav class="bottomnav">
    <div class="nav-item active" onclick="showPage('cases')" data-page="cases">
      <span class="nav-icon">🎁</span>
      <span class="nav-label">Кейсы</span>
    </div>
    <div class="nav-item" onclick="showPage('profile')" data-page="profile">
      <span class="nav-icon">👤</span>
      <span class="nav-label">Профиль</span>
    </div>
  </nav>
</div>

<div class="modal-overlay hidden" id="payModal" onclick="closeModal(event)">
  <div class="modal-sheet" onclick="event.stopPropagation()">
    <div class="modal-handle"></div>
    <div class="modal-title" id="modalTitle">Купить звёзды</div>
    <div class="modal-price" id="modalPrice"></div>
    <div id="modalMethods"></div>
    <button class="modal-cancel" onclick="document.getElementById('payModal').classList.add('hidden')">Отмена</button>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="js/app.js"></script>
</body>
</html>
